<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeChat Academy — Interactive Training</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f8;font-family:Inter,system-ui,Arial;color:#17253d}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid #dce4ee;flex-wrap:wrap}.brand{font-weight:800;color:#2857aa}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid #c9d6e8;background:white;border-radius:9px;padding:9px 12px;font-weight:650;cursor:pointer;color:#1e427a}button.primary{background:#2857aa;color:white;border-color:#2857aa}button:disabled{opacity:.4;cursor:not-allowed}.status{font-size:13px;color:#58677c}main{height:calc(100dvh - 70px);min-height:550px;display:flex;justify-content:center;padding:12px}iframe{width:100%;max-width:1100px;height:100%;border:1px solid #dce4ee;border-radius:16px;background:white;box-shadow:0 6px 28px #1a376014}@media(max-width:700px){main{height:calc(100dvh - 112px);padding:0}iframe{border:0;border-radius:0}.bar{padding:8px}.brand{font-size:14px}}</style></head><body><header class="bar"><div><div class="brand">SafeChat Academy</div><div class="status" id="status" aria-live="polite">Welcome · 0 of 3 scenarios completed</div></div><div class="controls"><button id="home">Home</button><button id="prev">Previous</button><button class="primary" id="next">Start training</button><button id="reset" title="Clear saved progress">Reset</button></div></header><main><iframe id="view" title="SafeChat training content"></iframe></main><script>
const base='stitch_visual_ui_design_system/';const pages=['safechat_academy_safety_first','functional_scam_awareness_chat','functional_global_rewards_awareness_chat','functional_windows_security_awareness_chat','training_complete_407x844'];let step=0;let done=JSON.parse(localStorage.getItem('safechat-completed')||'[false,false,false]');if(!Array.isArray(done)||done.length!==3)done=[false,false,false];const frame=document.getElementById('view');const next=document.getElementById('next');const prev=document.getElementById('prev');const status=document.getElementById('status');function persist(){localStorage.setItem('safechat-completed',JSON.stringify(done))}function show(n){step=Math.max(0,Math.min(4,n));frame.src=base+pages[step]+'/code.html';prev.disabled=step===0;next.textContent=step===0?'Start training':step===4?'Back to home':step===3?'Finish training':'Next scenario';status.textContent=(step===0?'Welcome':step===4?'Training complete':'Scenario '+step+' of 3')+' · '+done.filter(Boolean).length+' of 3 scenarios visited';}next.onclick=()=>{if(step===4){show(0);return}if(step>=1&&step<=3){done[step-1]=true;persist()}show(step+1)};prev.onclick=()=>show(step-1);document.getElementById('home').onclick=()=>show(0);document.getElementById('reset').onclick=()=>{if(confirm('Reset training progress?')){done=[false,false,false];persist();show(0)}};frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(step===0){const b=[...d.querySelectorAll('button')].find(b=>b.textContent.includes('Start Training'));if(b){b.removeAttribute('onclick');b.addEventListener('click',()=>show(1))}}if(step===4){const bs=[...d.querySelectorAll('button')];const restart=bs.find(b=>/restart|try again|train again/i.test(b.textContent));const activity=bs.find(b=>/next activity/i.test(b.textContent));if(restart)restart.addEventListener('click',()=>{done=[false,false,false];persist();show(0)});if(activity)activity.addEventListener('click',()=>show(0))}}catch(e){console.warn('Screen integration:',e)}});show(0);
</script></body></html>
